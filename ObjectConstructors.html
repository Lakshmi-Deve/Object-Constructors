<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Object Constructors</h1>
 
<p id="demo"></p>
 
<script>
 
// Constructor function for Person objects
function Student(name, subject, mark) {
  this.Name = name;
  this.Subject = subject;
  this.mark = mark;
}
 
// Create two Person objects
const student1 = new Student("John", "tamil", 50 );
const student2 = new Student("Sally", "english", 48);
 
// Display age
document.getElementById("demo").innerHTML =
"Student 1 got " + student1.mark +  "  marks in tamil" +". Student 2 got " + student2.mark + "  marks in english"; 
 
</script>
 
</body>
</html>
